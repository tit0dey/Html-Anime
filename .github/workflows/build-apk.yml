name: Build Open Brain Android APK

on:
  push:
    branches: [ "main", "arena/**" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Dependencies & Build Bundle
        run: |
          npm ci
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release & Debug APK
        working-directory: android
        run: gradle assembleRelease assembleDebug

      - name: Upload OpenBrain APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBrain-AI-APK
          path: android/app/build/outputs/apk/release/app-release.apk
