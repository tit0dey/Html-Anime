apply plugin: 'com.android.application'

android {
    namespace 'com.htmlanime.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.htmlanime.studio"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
